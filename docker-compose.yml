services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jotaish
      POSTGRES_PASSWORD: jotaish
      POSTGRES_DB: jotaish
    ports:
      - "5435:5432"
    volumes:
      - jotaish-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jotaish"]
      interval: 5s
      retries: 10

volumes:
  jotaish-db:
